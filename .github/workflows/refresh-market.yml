name: Refresh market and MaleCNS snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1-5"
    - cron: "17 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: flyfund-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-malecns.txt

      - uses: actions/cache@v4
        with:
          path: data/malecns
          key: malecns-v1-${{ hashFiles('vendor/stonkfly/neural/sources.lock.json', 'vendor/stonkfly/neural/arrays.lock.json') }}

      - name: Install neural runtime
        run: python -m pip install -r requirements-malecns.txt

      - name: Test and update market data
        run: |
          npm test
          npm run update

      - name: Prepare verified MaleCNS graph
        env:
          PYTHONPATH: vendor
          STONKFLY_DATA: data/malecns
        run: |
          if [ ! -f data/malecns/graph.npz ]; then
            python -c "from stonkfly.data import prepare; prepare()"
          fi

      - name: Compute latest connectome decisions
        env:
          PYTHONPATH: vendor
          STONKFLY_DATA: data/malecns
        run: python scripts/malecns-latest.py

      - name: Validate static deployment
        run: npm run build

      - name: Publish refreshed snapshots to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-cache.json data/malecns-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh market and MaleCNS snapshot"
            git push
          fi
